name: Compilar APK de Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Node.js (Sin cachés pesados)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 3. Configurar Java (QUITADO el caché que rompía la compilación)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. Instalar dependencias limpias
    - name: Instalar dependencias
      run: npm install

    # 5. Compilar la aplicación web
    - name: Compilar App Web
      run: npm run build

    # 6. Crear el entorno nativo de Android desde cero
    - name: Añadir plataforma Android
      run: |
        npx cap add android
        npx cap sync android

    # 7. Compilar el archivo APK final
    - name: Compilar APK (Modo Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Guardar el archivo APK para descargar
    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

