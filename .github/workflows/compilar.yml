name: Compilar APK de Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Node.js (v4 ya soporta Node 24 nativo en sus parches recientes)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 3. Configurar Java (Actualizado a v4 con parches de Node 24)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. Instalar dependencias del proyecto
    - name: Instalar dependencias de NPM
      run: npm install

    # 5. Compilar la aplicación web
    - name: Compilar App Web
      run: npm run build

    # 6. Añadir la plataforma Android al proyecto mediante Capacitor
    - name: Añadir plataforma Android
      run: |
        npx cap add android
        npx cap sync android

    # 7. Compilar el archivo APK final usando Gradle
    - name: Compilar APK (Modo Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Subir el archivo APK resultante
    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

