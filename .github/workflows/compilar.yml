name: Compilar APK de Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Esta variable de entorno soluciona la advertencia de Node 20 en GitHub
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar Node.js (CORREGIDO: 'node-version' y actualizado a v24)
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 3. Configurar Java (necesario para compilar Android)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. Instalar dependencias del proyecto
    - name: Instalar dependencias de NPM
      run: npm install

    # 5. Compilar la aplicación web (genera la carpeta dist)
    - name: Compilar App Web
      run: npm run build

    # 6. Añadir la plataforma Android al proyecto mediante Capacitor
    - name: Añadir plataforma Android
      run: |
        npx cap add android
        npx cap sync android

    # 7. Compilar el archivo APK final usando Gradle
    - name: Compilar APK (Modo Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Subir el archivo APK resultante para que lo puedas descargar
    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

